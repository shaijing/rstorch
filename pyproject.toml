[project]
name = "rstorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "shaijing", email = "lingyu.lynn@outlook.com" }]
dependencies = [
  "kernels>=0.19.0",
  "pytorch-optimizer>=4.1.1",
  "safetensors>=0.8.0",
  "torch==2.13",
  "transformers>=5.24.1",
]

[project.scripts]
rstorch = "rstorch:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
